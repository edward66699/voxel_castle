<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổ Thành &amp; Tam Long 3D</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #090e1a;
      --foreground: #e2e8f0;
      --card: #0f172a;
      --card-border: rgba(148, 163, 184, 0.25);
      --border: rgba(148, 163, 184, 0.28);
      --primary: #2563eb;
      --primary-foreground: #ffffff;
      --secondary: #1e293b;
      --secondary-foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      background: var(--background);
      color: var(--foreground);
      overflow: hidden;
    }
    #app {
      width: 100%;
      max-width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      gap: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }
    #app > * {
      min-width: 0;
      max-width: 100%;
    }
    #stage {
      flex: 1 1 0%;
      min-height: 260px;
      min-width: 0;
      width: 100%;
    }
    @media (max-width: 640px) {
      #app { padding: 4px; gap: 4px; }
      #stage { min-height: 0; }
      .ctrl-strip {
        width: 100%;
        min-width: 0;
        flex-wrap: wrap;
        gap: 3px;
      }
      .ctrl-strip > div {
        flex-wrap: wrap;
        gap: 3px;
        max-width: 100%;
      }
      .ctrl-strip .pill-btn {
        padding: 2px 5px;
        font-size: 10px;
      }
    }
    canvas { touch-action: none; }
    .pill-btn {
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease, transform 100ms ease, box-shadow 140ms ease;
    }
    .pill-btn:active { transform: scale(0.97); }
    #stage:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }
    #stage:fullscreen #glcanvas {
      height: 100%;
    }
  </style>
</head>
<body class="antialiased p-0 m-0">
  <div id="app" class="select-none">
    <div id="stage" class="relative w-full rounded-xl overflow-hidden border border-[var(--card-border)] bg-[var(--card)]">
      <canvas id="glcanvas" class="block w-full h-full cursor-grab active:cursor-grabbing"></canvas>

      <div class="pointer-events-none absolute top-2 left-2 max-w-[calc(100%-92px)] flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-950/75 text-white/95 text-xs border border-white/15 truncate">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
        <span class="font-medium shrink-0">Cổ Thành &amp; Tứ Linh</span>
        <span id="voxel-badge" class="text-white/80 font-mono text-[11px] pl-1 border-l border-white/20 truncate">Đang dựng khối...</span>
      </div>

      <button id="btn-fs" title="Toàn màn hình" class="absolute top-2 right-2 px-2.5 py-1 rounded-md bg-slate-950/75 hover:bg-slate-900/90 text-white/95 text-[11px] border border-white/15 transition">
        Phóng to
      </button>

      <div class="absolute bottom-2 left-2 max-w-[calc(100%-16px)] flex flex-wrap items-center gap-1 px-2 py-0.5 rounded-md bg-slate-950/80 text-white/90 text-[10px] sm:text-[11px] border border-white/15">
        <span class="text-white/70">Theo:</span>
        <button data-follow="green" class="follow-btn px-1.5 rounded font-medium bg-emerald-600 text-white transition">Thanh Long</button>
        <button data-follow="white" class="follow-btn px-1.5 rounded font-medium text-cyan-200 hover:bg-white/15 transition">Bạch Long</button>
        <button data-follow="black" class="follow-btn px-1.5 rounded font-medium text-violet-300 hover:bg-white/15 transition">Hắc Long</button>
        <button data-follow="phoenix" class="follow-btn px-1.5 rounded font-medium text-amber-300 hover:bg-white/15 transition">Phượng Hoàng</button>
        <button data-follow="xuanwu" class="follow-btn px-1.5 rounded font-medium text-teal-300 hover:bg-white/15 transition">Huyền Vũ</button>
      </div>

      <div class="hidden md:block pointer-events-none absolute bottom-2 right-2 px-2 py-0.5 rounded-md bg-slate-950/75 text-white/85 text-[11px] border border-white/15">
        F Lửa · T Tuyết · S Sét · G Hợp Kích · P Phượng · H Bức Tốc · X Huyền Vũ
      </div>
    </div>

    <div class="space-y-1 text-[11px] px-0.5 shrink-0">
      <div class="ctrl-strip flex flex-wrap items-center justify-between gap-1">
        <div class="flex items-center gap-1 flex-wrap">
          <span class="text-[var(--muted-foreground)]">Sáng:</span>
          <button data-time="sunset" class="time-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">Hoàng hôn</button>
          <button data-time="night" class="time-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Đêm trăng</button>
          <button data-time="day" class="time-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Ban ngày</button>
          <span class="text-[var(--muted-foreground)] ml-1">Thời tiết:</span>
          <button data-weather="clear" class="wx-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">Quang đãng</button>
          <button data-weather="fog" class="wx-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Sương mù</button>
          <button data-weather="storm" class="wx-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Trời giông</button>
          <button data-weather="snow" class="wx-btn pill-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Trời tuyết</button>
        </div>
        <button id="btn-audio" class="pill-btn px-2.5 py-0.5 rounded border border-emerald-500/50 bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-500 font-medium shrink-0">Nhạc nền: Tắt</button>
      </div>

      <div class="ctrl-strip flex flex-wrap items-center justify-between gap-1">
        <div class="flex items-center gap-1 flex-wrap">
          <span class="text-[var(--muted-foreground)]">Góc:</span>
          <button data-cam="render" class="cam-btn pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">Chuẩn</button>
          <button data-cam="overview" class="cam-btn pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Quay 360°</button>
          <button data-cam="dragon" class="cam-btn pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Theo Rồng</button>
          <button data-cam="waterfall" class="cam-btn pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Thác Nước</button>
          <button data-cam="pagoda" class="cam-btn pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]">Cổ Tháp</button>
        </div>
        <div class="flex items-center gap-1 flex-wrap">
          <button id="btn-xuanwu" class="pill-btn px-1.5 py-0.5 rounded border border-teal-400/75 bg-teal-500/20 hover:bg-teal-500/35 text-teal-300 font-semibold">Huyền Vũ (X)</button>
          <button id="btn-converge" class="pill-btn px-1.5 py-0.5 rounded border border-purple-500/70 bg-purple-500/20 hover:bg-purple-500/35 text-purple-400 font-semibold">Hợp Kích (G)</button>
          <button id="btn-boost" class="pill-btn px-1.5 py-0.5 rounded border border-red-500/75 bg-red-600/20 hover:bg-red-600/35 text-red-400 font-semibold">Bức Tốc (H)</button>
          <button id="btn-phoenix" class="pill-btn px-1.5 py-0.5 rounded border border-rose-500/70 bg-rose-500/20 hover:bg-rose-500/35 text-rose-400 font-semibold">Phượng (P)</button>
          <button id="btn-fire" class="pill-btn px-1.5 py-0.5 rounded border border-amber-500/60 bg-amber-500/15 hover:bg-amber-500/30 text-amber-500 font-semibold">Lửa (F)</button>
          <button id="btn-snow" class="pill-btn px-1.5 py-0.5 rounded border border-cyan-500/60 bg-cyan-500/15 hover:bg-cyan-500/30 text-cyan-400 font-semibold">Tuyết (T)</button>
          <button id="btn-bolt" class="pill-btn px-1.5 py-0.5 rounded border border-violet-500/60 bg-violet-500/15 hover:bg-violet-500/30 text-violet-400 font-semibold">Sét (S)</button>
          <button id="toggle-play" class="pill-btn px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">Dừng</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('glcanvas');
    const voxelBadge = document.getElementById('voxel-badge');
    const btnFire = document.getElementById('btn-fire');
    const btnSnow = document.getElementById('btn-snow');
    const btnBolt = document.getElementById('btn-bolt');
    const btnPhoenix = document.getElementById('btn-phoenix');
    const btnXuanwu = document.getElementById('btn-xuanwu');
    const btnConverge = document.getElementById('btn-converge');
    const btnBoost = document.getElementById('btn-boost');
    const btnAudio = document.getElementById('btn-audio');
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
    if (!gl) {
      voxelBadge.textContent = 'WebGL2 không khả dụng';
      return;
    }

    // ---------- Sino-Japanese Soundtrack + Dynamic Weather & Tri-Dragon SFX ----------
    class EastAsianSoundtrack {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.master = null;
        this.reverbIn = null;
        this.rainGain = null;
        this.rainSrc = null;
        this.timer = null;
        this.step = 0;
        this.noiseBuf = null;
        this.weather = 'clear';
        this.kotoScale = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99, 880.00];
        this.kotoPattern = [0, 2, 3, 5, 4, 3, 2, 1, 0, 3, 5, 7, 6, 5, 3, 2, 3, 5, 8, 7, 5, 4, 3, 2, 1, 2, 3, 5, 4, 2, 0, -1];
        this.flutePhrase = [
          { step: 0, freq: 587.33, dur: 1.9, bend: 554.37 },
          { step: 6, freq: 659.25, dur: 1.3, bend: 587.33 },
          { step: 10, freq: 739.99, dur: 2.2, bend: 659.25 },
          { step: 16, freq: 880.00, dur: 1.8, bend: 739.99 },
          { step: 22, freq: 659.25, dur: 1.5, bend: 587.33 },
          { step: 26, freq: 587.33, dur: 2.4, bend: 493.88 }
        ];
      }

      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.42;
        this.master.connect(this.ctx.destination);

        this.reverbIn = this.ctx.createGain();
        const dry = this.ctx.createGain();
        dry.gain.value = 0.78;
        this.reverbIn.connect(dry);
        dry.connect(this.master);

        const d1 = this.ctx.createDelay(1.0);
        const d2 = this.ctx.createDelay(1.0);
        d1.delayTime.value = 0.29;
        d2.delayTime.value = 0.43;
        const fb1 = this.ctx.createGain(); fb1.gain.value = 0.36;
        const fb2 = this.ctx.createGain(); fb2.gain.value = 0.32;
        const lpf = this.ctx.createBiquadFilter();
        lpf.type = 'lowpass'; lpf.frequency.value = 2100;
        const wet = this.ctx.createGain(); wet.gain.value = 0.45;

        this.reverbIn.connect(d1);
        d1.connect(fb1); fb1.connect(d2);
        d2.connect(fb2); fb2.connect(lpf); lpf.connect(d1);
        d1.connect(wet); d2.connect(wet);
        wet.connect(this.master);

        const len = this.ctx.sampleRate * 2;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = this.noiseBuf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          b0 = 0.99765 * b0 + w * 0.099046;
          b1 = 0.96300 * b1 + w * 0.296516;
          b2 = 0.57000 * b2 + w * 1.052691;
          data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
        }
        const fade = Math.min(2048, Math.floor(len * 0.05));
        for (let i = 0; i < fade; i++) {
          const t = i / fade;
          data[i] = data[i] * t + data[len - fade + i] * (1 - t);
        }

        this.rainGain = this.ctx.createGain();
        this.rainGain.gain.value = 0.0;
        const rFilt = this.ctx.createBiquadFilter();
        rFilt.type = 'bandpass'; rFilt.frequency.value = 1350; rFilt.Q.value = 0.65;
        this.rainSrc = this.ctx.createBufferSource();
        this.rainSrc.buffer = this.noiseBuf;
        this.rainSrc.loop = true;
        this.rainSrc.connect(rFilt);
        rFilt.connect(this.rainGain);
        this.rainGain.connect(this.master);
        this.rainSrc.start();
      }

      setWeather(w) {
        this.weather = w;
        if (!this.ctx || !this.rainGain) return;
        const targetRain = (this.enabled && w === 'storm') ? 0.22 : 0.0;
        this.rainGain.gain.setTargetAtTime(targetRain, this.ctx.currentTime, 0.35);
      }

      toggle() {
        this.init();
        if (!this.ctx) return false;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.enabled = !this.enabled;
        this.setWeather(this.weather);
        if (this.enabled) {
          this.step = 0;
          this.playTempleGong(73.42);
          this.tick();
          this.timer = setInterval(() => this.tick(), 340);
        } else {
          clearInterval(this.timer);
          this.timer = null;
        }
        return this.enabled;
      }

      playKoto(freq, vel = 0.16, bend = false) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator(), osc2 = this.ctx.createOscillator();
        osc1.type = 'triangle'; osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(bend ? freq * 0.96 : freq, t);
        osc2.frequency.setValueAtTime((bend ? freq * 0.96 : freq) * 2.002, t);
        if (bend) {
          osc1.frequency.exponentialRampToValueAtTime(freq, t + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(freq * 2.002, t + 0.11);
        }
        const filt = this.ctx.createBiquadFilter();
        filt.type = 'lowpass'; filt.Q.value = 3.2;
        filt.frequency.setValueAtTime(Math.min(freq * 9.0, 5200), t);
        filt.frequency.exponentialRampToValueAtTime(freq * 1.4, t + 1.4);

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vel, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);

        osc1.connect(filt);
        const o2g = this.ctx.createGain(); o2g.gain.value = 0.28;
        osc2.connect(o2g); o2g.connect(filt);
        filt.connect(g); g.connect(this.reverbIn);
        osc1.start(t); osc2.start(t);
        osc1.stop(t + 2.25); osc2.stop(t + 2.25);
      }

      playFlute(freq, dur, startFreq) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq || freq * 0.92, t);
        osc.frequency.exponentialRampToValueAtTime(freq, t + 0.28);

        const vib = this.ctx.createOscillator(), vibG = this.ctx.createGain();
        vib.frequency.value = 4.8;
        vibG.gain.setValueAtTime(0, t);
        vibG.gain.linearRampToValueAtTime(freq * 0.012, t + 0.55);
        vib.connect(vibG); vibG.connect(osc.frequency);

        const sub = this.ctx.createOscillator();
        sub.type = 'triangle'; sub.frequency.value = freq * 2;
        const subG = this.ctx.createGain(); subG.gain.value = 0.10;
        sub.connect(subG);

        const nSrc = this.ctx.createBufferSource(); nSrc.buffer = this.noiseBuf;
        const nBp = this.ctx.createBiquadFilter();
        nBp.type = 'bandpass'; nBp.frequency.value = freq * 1.5; nBp.Q.value = 4.0;
        const nG = this.ctx.createGain();
        nG.gain.setValueAtTime(0.0001, t);
        nG.gain.linearRampToValueAtTime(0.045, t + 0.14);
        nG.gain.exponentialRampToValueAtTime(0.006, t + dur);
        nSrc.connect(nBp); nBp.connect(nG);

        const env = this.ctx.createGain();
        env.gain.setValueAtTime(0.0001, t);
        env.gain.linearRampToValueAtTime(0.11, t + 0.24);
        env.gain.setValueAtTime(0.095, t + dur * 0.65);
        env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        osc.connect(env); subG.connect(env); nG.connect(env);
        env.connect(this.reverbIn);
        osc.start(t); sub.start(t); vib.start(t); nSrc.start(t);
        osc.stop(t + dur + 0.1); sub.stop(t + dur + 0.1); vib.stop(t + dur + 0.1); nSrc.stop(t + dur + 0.1);
      }

      playTaiko(accent = 1.0) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(102, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.22);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.28 * accent, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
        osc.connect(g); g.connect(this.reverbIn);
        osc.start(t); osc.stop(t + 0.75);
      }

      playTempleGong(base = 73.42) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        [1, 1.5, 2.02, 2.98].forEach((r, idx) => {
          const osc = this.ctx.createOscillator();
          osc.type = idx === 0 ? 'sine' : 'triangle';
          osc.frequency.value = base * r;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.11 / (idx + 1), t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 4.8);
          osc.connect(g); g.connect(this.reverbIn);
          osc.start(t); osc.stop(t + 5.0);
        });
      }

      playThunder() {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        const nSrc = this.ctx.createBufferSource(); nSrc.buffer = this.noiseBuf;
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.setValueAtTime(420, t); lp.frequency.exponentialRampToValueAtTime(75, t + 2.4);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.45, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
        nSrc.connect(lp); lp.connect(g); g.connect(this.reverbIn);
        nSrc.start(t); nSrc.stop(t + 2.6);
      }

      playDragonFire() {
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const growl = this.ctx.createOscillator();
        growl.type = 'sawtooth'; growl.frequency.setValueAtTime(115, t); growl.frequency.exponentialRampToValueAtTime(52, t + 1.4);
        const gFilt = this.ctx.createBiquadFilter();
        gFilt.type = 'lowpass'; gFilt.frequency.setValueAtTime(480, t); gFilt.frequency.exponentialRampToValueAtTime(160, t + 1.4);
        const gGain = this.ctx.createGain();
        gGain.gain.setValueAtTime(0.001, t); gGain.gain.linearRampToValueAtTime(0.18, t + 0.08); gGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
        growl.connect(gFilt); gFilt.connect(gGain); gGain.connect(this.reverbIn);
        growl.start(t); growl.stop(t + 1.55);

        const nSrc = this.ctx.createBufferSource(); nSrc.buffer = this.noiseBuf;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.setValueAtTime(950, t); bp.frequency.exponentialRampToValueAtTime(280, t + 1.8);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.001, t); nGain.gain.linearRampToValueAtTime(0.32, t + 0.07); nGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.85);
        nSrc.connect(bp); bp.connect(nGain); nGain.connect(this.reverbIn);
        nSrc.start(t); nSrc.stop(t + 1.9);
      }

      playSnowBreath() {
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        const nSrc = this.ctx.createBufferSource(); nSrc.buffer = this.noiseBuf;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'bandpass'; hp.Q.value = 1.6; hp.frequency.setValueAtTime(2400, t); hp.frequency.exponentialRampToValueAtTime(900, t + 1.8);
        const ng = this.ctx.createGain();

        float galHalo = exp(-abs(bandLat) * 2.0);

        float riftPattern = abs(sin(gLon * 4.2 + w2 * 2.1) * cos(bandLat * 19.5 + w3 * 2.4));
        float darkRift = smoothstep(0.06, 0.54, riftPattern) * exp(-bandLat * bandLat * 58.0);

        vec3 nebViolet = vec3(0.36, 0.12, 0.84);
        vec3 nebCyan = vec3(0.08, 0.62, 0.96);
        vec3 nebMagenta = vec3(0.88, 0.22, 0.68);
        vec3 coreGold = vec3(1.00, 0.82, 0.50);

        vec3 galCol = mix(nebViolet, nebCyan, smoothstep(0.18, 0.82, w2)) * galHalo * 0.66;
        galCol += mix(nebMagenta, nebCyan, w3) * galSpine * (0.45 + 0.55 * w4) * 0.88;
        galCol += coreGold * (coreBulge * 1.15 + pow(galSpine, 2.4) * 0.42);
        galCol *= (1.0 - darkRift * 0.78);

        float skyMask = smoothstep(-0.16, 0.12, dir.y);
        col += galCol * uCrimsonGlow * skyMask * 1.24;

        // Uniform Cube-Mapped Pinpoint Starfield (zero rectangular grid tiles!)
        vec3 ad = abs(dir);
        vec2 cProj = (ad.y >= ad.x && ad.y >= ad.z) ? (dir.xz / max(ad.y, 0.001) + vec2(1.0, 3.0))
                   : ((ad.x >= ad.z) ? (dir.yz / max(ad.x, 0.001) + vec2(5.0, 7.0)) : (dir.xy / max(ad.z, 0.001) + vec2(9.0, 11.0)));

        for (int layer = 0; layer < 2; layer++) {
          float scale = (layer == 0) ? 95.0 : 46.0;
          vec2 st = cProj * scale + float(layer) * 19.7;
          vec2 cell = floor(st);
          vec2 fUv = fract(st);
          float h1 = hash21(cell + 0.13);
          float h2 = hash21(cell + 7.31);
          float h3 = hash21(cell + 13.7);
          float density = (layer == 0) ? mix(0.955, 0.76, clamp(galSpine * 1.15, 0.0, 1.0)) : mix(0.985, 0.92, galHalo);
          if (h1 > density) {
            vec2 off = vec2(0.24) + vec2(h2, h3) * 0.52;
            float dStar = length(fUv - off);
            float rad = (layer == 0) ? 0.14 : 0.22;
            float pin = exp(-(dStar * dStar) / (rad * rad * 0.35)) * smoothstep(rad * 1.6, 0.0, dStar);
            float tw = 0.62 + 0.38 * sin(uTime * (2.2 + h2 * 4.8) + h3 * 75.0);
            vec3 sCol = (layer == 0)
              ? mix(vec3(0.74, 0.90, 1.00), vec3(1.00, 0.86, 0.62), h3)
              : mix(vec3(0.58, 0.92, 1.00), vec3(0.98, 0.62, 1.00), h2);
            col += sCol * pin * tw * ((layer == 0) ? 1.15 : 1.55) * uCrimsonGlow * skyMask * (0.85 + coreBulge * 0.55);
          }
        }
      }

      if (uStarAmount > 0.01 && dir.y > 0.04) {
        vec3 ad0 = abs(dir);
        vec2 c0 = (ad0.y >= ad0.x && ad0.y >= ad0.z) ? dir.xz / max(ad0.y, 0.001) : ((ad0.x >= ad0.z) ? dir.yz / max(ad0.x, 0.001) + 4.0 : dir.xy / max(ad0.z, 0.001) + 8.0);
        vec2 gSt = c0 * 58.0;
        vec2 gCell = floor(gSt), gF = fract(gSt);
        float r = hash21(gCell);
        if (r > 0.955) {
          vec2 off0 = vec2(0.25) + vec2(hash21(gCell + 3.1), hash21(gCell + 9.4)) * 0.50;
          float d0 = length(gF - off0);
          float pin0 = exp(-(d0 * d0) / 0.012) * smoothstep(0.28, 0.0, d0);
          float tw = 0.58 + 0.42 * sin(uTime * (1.8 + r * 4.2) + r * 62.0);
          col += vec3(0.85, 0.93, 1.0) * pin0 * tw * 1.45 * uStarAmount * smoothstep(0.04, 0.35, dir.y);
        }
      }
      fragColor = vec4(col, 1.0);
      vec3 galBloom = max(col - vec3(0.42), vec3(0.0)) * uCrimsonGlow * 0.45;
      fragGlow = vec4(uSunColor * (sunDisc * 0.9 + pow(sunDot, 20.0) * 0.30) * uSunVis + galBloom, 1.0);
    }`;

    const shadowStaticVS = `#version 300 es
    layout(location=0) in vec3 aPos;
    uniform mat4 uLightVP;
    void main() {
      gl_Position = uLightVP * vec4(aPos, 1.0);
    }`;

    const shadowInstVS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=3) in vec3 iPos;
    layout(location=4) in vec4 iQuat;
    layout(location=5) in vec3 iScale;
    uniform mat4 uLightVP;
    vec3 rotQuat(vec4 q, vec3 v) {
      vec3 t = 2.0 * cross(q.xyz, v);
      return v + q.w * t + cross(q.xyz, t);
    }
    void main() {
      vec3 worldPos = iPos + rotQuat(iQuat, aPos * iScale);
      gl_Position = uLightVP * vec4(worldPos, 1.0);
    }`;

    const shadowFS = `#version 300 es
    precision highp float;
    void main() {}`;

    const lightingCommonFS = `
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    uniform vec3 uAmbientColor;
    uniform vec3 uFogColor;
    uniform vec3 uFogHorizon;
    uniform vec3 uCamPos;
    uniform float uTime;
    uniform float uRainWetness;
    uniform float uSnowCover;
    uniform float uFogDensity;
    uniform float uLightning;
    uniform vec3 uLightPos[14];
    uniform vec3 uLightCol[14];
    uniform float uLightRange[14];
    uniform int uLightCount;
    uniform sampler2D uShadowMap;
    uniform float uUseShadow;
    uniform float uSeaWater;
    uniform float uWaterWaveR;
    uniform float uSeaSummonFlash;
    uniform vec2 uXuanwuPos;

    float hash31(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    float computeShadow(vec3 shadowCoord, float geomNdl) {
      if (uUseShadow < 0.5) return 1.0;
      if (geomNdl <= 0.01) return 0.0;
      if (shadowCoord.x < 0.01 || shadowCoord.x > 0.99 || shadowCoord.y < 0.01 || shadowCoord.y > 0.99 || shadowCoord.z > 0.999) return 1.0;
      float bias = max(0.0018 * (1.0 - geomNdl), 0.0006);
      vec2 texel = vec2(1.0 / 1280.0);
      float refZ = shadowCoord.z - bias;
      float sum = 0.0;
      sum += (refZ <= texture(uShadowMap, shadowCoord.xy + vec2(-0.62, -0.32) * texel).r) ? 1.0 : 0.0;
      sum += (refZ <= texture(uShadowMap, shadowCoord.xy + vec2( 0.32, -0.62) * texel).r) ? 1.0 : 0.0;
      sum += (refZ <= texture(uShadowMap, shadowCoord.xy + vec2(-0.32,  0.62) * texel).r) ? 1.0 : 0.0;
      sum += (refZ <= texture(uShadowMap, shadowCoord.xy + vec2( 0.62,  0.32) * texel).r) ? 1.0 : 0.0;
      return sum * 0.25;
    }

    void computeVoxelShading(
      vec3 worldPos, vec3 inN, vec3 baseCol, float ao, float emissive, vec2 uv, float style, vec3 shadowCoord,
      out vec3 outColor, out vec3 outGlow
    ) {
      vec2 cuv = fract(uv * 0.99998);
      float edgeDist = min(min(cuv.x, 1.0 - cuv.x), min(cuv.y, 1.0 - cuv.y));
      float isWater = (emissive < -0.5) ? 1.0 : 0.0;
      float bevel = mix(mix(0.76, 1.05, smoothstep(0.0, 0.08, edgeDist)), 1.0, isWater);

      vec3 N = inN;
      vec3 col = baseCol;
      float microAO = 1.0;
      float specBoost = 0.0;
      float waterGlow = 0.0;

      if (emissive > 0.5) {
        vec3 emCol = baseCol * (1.06 + 0.28 * emissive) * mix(0.92, 1.04, bevel);
        outColor = emCol;
        outGlow = baseCol * clamp((emissive - 0.72) * 0.42, 0.0, 0.92);
        return;
      }

      vec3 camVec = uCamPos - worldPos;
      float dist = length(camVec);
      bool nearDetail = dist < 86.0;
      bool nearLit = dist < 114.0;

      vec2 camDeltaXZ = worldPos.xz - uXuanwuPos;
      float distXuanwu = length(camDeltaXZ);
      float isOceanFloor = (style > 7.5) ? 1.0 : 0.0;

      if (isOceanFloor > 0.5) {
        float abyssFog0 = clamp(exp(-5.0 * 0.36) * 0.76, 0.0, 0.92);
        float distFog0 = clamp(1.0 - exp(-pow(max(dist - (84.0 / uFogDensity), 0.0) * 0.010 * uFogDensity, 1.4)), 0.0, 0.90);
        vec3 abyssCol = mix(baseCol * (uAmbientColor + uSunColor * 0.22), mix(uFogColor, uFogHorizon, 0.68), clamp(abyssFog0 + distFog0, 0.0, 0.94));
        float waveFront = smoothstep(-7.0, 3.5, uWaterWaveR - distXuanwu);
        float effWater = uSeaWater * waveFront;
        if (effWater < 0.005) {
          outColor = abyssCol;
          outGlow = vec3(0.0);
          return;
        }
        float phA = dot(worldPos.xz, vec2(0.86, 0.51)) * 0.42 + uTime * 2.15;
        float phB = dot(worldPos.xz, vec2(-0.56, 0.83)) * 0.58 - uTime * 1.80;
        float phC = dot(worldPos.xz, vec2(0.32, -0.95)) * 1.15 + uTime * 2.95;
        float phD = dot(worldPos.xz, vec2(0.74, -0.67)) * 2.35 - uTime * 3.85;
        float phE = dot(worldPos.xz, vec2(-0.91, -0.41)) * 3.65 + uTime * 4.60;

        float wave1 = sin(phA) * 0.56 + sin(phB) * 0.44;
        float wave2 = sin(phC) * 0.52 + 0.48 * sin(phA * 1.6 - phB * 1.3);
        float capRipple = sin(phD) * 0.5 + cos(phE + wave1 * 1.2) * 0.5;
        float swell = sin(worldPos.x * 0.22 + uTime * 1.75) * cos(worldPos.z * 0.20 - uTime * 1.40);

        float nxG = 0.21 * cos(phA) * 0.86 - 0.17 * cos(phB) * 0.56 + 0.11 * cos(phC) * 0.32 + 0.065 * cos(phD) * 0.74 - 0.045 * cos(phE) * 0.91;
        float nzG = 0.21 * cos(phA) * 0.51 + 0.17 * cos(phB) * 0.83 - 0.11 * cos(phC) * 0.95 - 0.065 * cos(phD) * 0.67 - 0.045 * cos(phE) * 0.41;

        float wakeRing = exp(-max(distXuanwu - 3.4, 0.0) * 0.12) * (0.30 + 0.70 * pow(0.5 + 0.5 * sin(distXuanwu * 1.75 - uTime * 4.6), 2.2));
        float shockRing = exp(-abs(distXuanwu - uWaterWaveR) * 0.24) * smoothstep(2.5, 9.0, uWaterWaveR) * (1.0 - smoothstep(195.0, 235.0, uWaterWaveR));
        vec2 radDir = camDeltaXZ / max(distXuanwu, 0.001);
        N = normalize(vec3(nxG + radDir.x * shockRing * 0.38, 1.0, nzG + radDir.y * shockRing * 0.38));

        vec3 L = normalize(uSunDir);
        float sh = computeShadow(shadowCoord, max(N.y, 0.1));
        vec3 V = camVec / max(dist, 0.0001);
        vec3 H = normalize(L + V);
        vec3 R = reflect(-V, N);
        float ndv = max(dot(N, V), 0.0);
        float fres = 0.04 + 0.96 * pow(1.0 - ndv, 4.2);
        float ndlW = max(dot(N, L), 0.0);

        // Coastal Bathymetry (Main Island + 3 Satellite Islets) & Dual-Grid Voronoi Caustic Network
        float shoreWobble = sin(worldPos.x * 0.15) * 2.3 + cos(worldPos.z * 0.16) * 2.1;
        float shoreDist = length(worldPos.xz * vec2(1.0, 1.04)) + shoreWobble;
        float satDist = min(
          length((worldPos.xz - vec2(-64.0, -38.0)) * vec2(0.85, 1.0)),
          min(length((worldPos.xz - vec2(63.0, -42.0)) * vec2(0.82, 0.96)), length((worldPos.xz - vec2(4.0, -72.0)) * vec2(0.82, 1.0)))
        );
        float shallowMask = clamp(exp(-max(shoreDist - 36.5, 0.0) * 0.115) + exp(-max(satDist - 10.5, 0.0) * 0.16) * 0.78, 0.0, 1.0);

        vec2 cUv1 = worldPos.xz * 0.58 + vec2(wave1 * 0.38, wave2 * 0.38) + uTime * vec2(0.42, -0.32);
        vec2 cUv2 = worldPos.xz * 0.86 - vec2(wave2 * 0.32, wave1 * 0.32) + uTime * vec2(-0.35, 0.46);
        float cG1 = abs(sin(cUv1.x + sin(cUv1.y * 1.25)) * cos(cUv1.y + cos(cUv1.x * 1.25)));
        float cG2 = abs(sin(cUv2.x + cos(cUv2.y * 1.35)) * cos(cUv2.y - sin(cUv2.x * 1.35)));
        float causticNet = pow(clamp(1.0 - min(cG1, cG2) * 1.55, 0.0, 1.0), 2.8);

        // Lacy Cellular Sea-Foam Filigrees & Rhythmic Shoreline Breaking Surf
        vec2 fUv = worldPos.xz * 1.12 + vec2(wave1 * 0.95, wave2 * 0.95) + uTime * vec2(0.55, -0.45);
        float foamCell = pow(clamp(1.0 - abs(sin(fUv.x + cos(fUv.y)) * cos(fUv.y - sin(fUv.x))) * 1.35, 0.0, 1.0), 2.4);

        float surfWave1 = 0.5 + 0.5 * sin(shoreDist * 1.65 - uTime * 3.15 + wave1 * 1.55);
        float surfWave2 = 0.5 + 0.5 * sin(shoreDist * 2.85 - uTime * 4.40 - wave2 * 1.25);
        float shoreBand = exp(-abs(shoreDist - 39.2) * 0.28) * (pow(surfWave1, 2.2) * 0.72 + surfWave2 * foamCell * 0.48);
        float satSurf = exp(-abs(satDist - 11.8) * 0.38) * (0.45 + 0.55 * sin(satDist * 1.9 - uTime * 3.2 + wave1));

        float crestStreak = pow(clamp(0.5 + 0.5 * sin(phA * 0.92 + sin(phB * 0.68) * 0.92), 0.0, 1.0), 5.5);
        float crestGate = smoothstep(0.16, 0.84, 0.5 + 0.5 * sin(phB * 0.72 + cos(phA * 0.38)));
        float ridgeFoam = crestStreak * crestGate * (0.42 + foamCell * 0.58) * 0.72;
        float foamCrest = clamp(ridgeFoam + wakeRing * (0.58 + foamCell * 0.42) + (shoreBand + satSurf) * 0.76 + shockRing * 1.15, 0.0, 0.98);

        vec3 abyssalNavy = vec3(0.015, 0.13, 0.29);
        vec3 pelagicBlue = vec3(0.04, 0.32, 0.52);
        vec3 shallowTurquoise = vec3(0.07, 0.58, 0.68);
        vec3 sssWater = vec3(0.14, 0.78, 0.82) * (pow(max(dot(V, -L), 0.0), 2.4) * 0.38 + max(swell + wave1 * 0.5, 0.0) * 0.18) * uSunColor;

        vec3 wCol = mix(abyssalNavy, pelagicBlue, clamp(0.42 + 0.40 * swell + wave1 * 0.22, 0.0, 1.0));
        wCol = mix(wCol, shallowTurquoise, shallowMask * 0.78);
        wCol *= (uAmbientColor * 1.25 + uSunColor * (ndlW * 0.82 * sh + 0.18));
        wCol += vec3(0.24, 0.90, 0.96) * causticNet * (0.16 + shallowMask * 0.52) * (0.35 + 0.65 * sh);
        wCol += sssWater;

        // Fresnel Sky & Cosmic Reflection + Multi-Lobe Sun/Starlight Diamond Glitter + Point Light Reflections
        vec3 skyRefl = mix(uFogHorizon * 1.08, uAmbientColor * 1.75 + uSunColor * 0.22, clamp(R.y * 1.65, 0.0, 1.0));
        wCol = mix(wCol, skyRefl, fres * 0.64);

        float specTight = pow(max(dot(N, H), 0.0), 210.0) * 2.45;
        float specBroad = pow(max(dot(N, H), 0.0), 38.0) * 0.38;
        float glitterFacet = smoothstep(0.25, 0.92, capRipple) * pow(max(dot(N, H), 0.0), 72.0) * 0.95;
        vec3 sunSpec = uSunColor * (specTight + specBroad + glitterFacet) * (0.25 + 0.75 * sh);
        wCol += sunSpec;

        for (int i = 0; i < 6; i++) {
          if (i >= uLightCount) break;
          vec3 lVec = uLightPos[i] - worldPos;
          float lD2 = dot(lVec, lVec);
          if (lD2 < uLightRange[i]) {
            vec3 lDir = lVec * inversesqrt(max(lD2, 0.001));
            vec3 lH = normalize(lDir + V);
            float att = pow(1.0 - clamp(lD2 / uLightRange[i], 0.0, 1.0), 2.0);
            wCol += uLightCol[i] * (max(dot(N, lDir), 0.0) * 0.22 + pow(max(dot(N, lH), 0.0), 42.0) * 0.65) * att;
          }
        }

        vec3 foamTint = mix(vec3(0.84, 0.96, 1.00), vec3(0.55, 0.96, 1.00), shockRing * 0.45);
        wCol = mix(wCol, foamTint, foamCrest);

        float mistRem = exp(-max(worldPos.y + 8.8, 0.0) * 0.36) * 0.76 * (1.0 - effWater * 0.93);
        float distFogW = clamp(1.0 - exp(-pow(max(dist - (92.0 / uFogDensity), 0.0) * 0.010 * uFogDensity, 1.4)), 0.0, 0.88);
        vec3 finalWater = mix(wCol, mix(uFogColor, uFogHorizon, 0.55), clamp(mistRem + distFogW, 0.0, 0.90));
        outColor = mix(abyssCol, finalWater, effWater);
        outGlow = vec3(0.18, 0.88, 0.98) * clamp(wakeRing * 0.26 + shockRing * 0.82 + causticNet * shallowMask * 0.16, 0.0, 0.92) + sunSpec * 0.26 * effWater;
        return;
      }

      if (isWater > 0.5) {
        if (inN.y > 0.5) {
          float r1 = sin(worldPos.x * 2.1 + uTime * (1.6 + uRainWetness * 2.5)) * cos(worldPos.z * 2.3 - uTime * (1.3 + uRainWetness * 2.5));
          float r2 = sin((worldPos.x - worldPos.z) * 3.4 - uTime * 2.1);
          float caustic = smoothstep(0.32, 0.96, sin(worldPos.x * 1.65 + r2) * cos(worldPos.z * 1.75 - r1) * 0.5 + 0.5);
          N = normalize(inN + vec3(r1 * 0.055 + r2 * 0.03, 0.0, r2 * 0.055 - r1 * 0.03));
          float spillLip = smoothstep(18.6, 20.1, worldPos.z);
          float lipFoam = spillLip * (0.55 + 0.45 * sin(worldPos.x * 3.6 + uTime * 5.2));
          col = mix(vec3(0.06, 0.43, 0.56), vec3(0.16, 0.68, 0.76), 0.42 + 0.25 * r1 + caustic * 0.16);
          col = mix(col, vec3(0.84, 0.97, 1.00), clamp(lipFoam * 0.78, 0.0, 0.88));
          specBoost = 1.15;
          waterGlow = lipFoam * 0.16 + caustic * 0.04;
        } else {
          float colStream = 0.5 + 0.5 * sin(worldPos.x * 4.4);
          float fallFlow = sin(worldPos.y * 1.9 + uTime * 11.5 + sin(worldPos.x * 3.1) * 1.4);
          float streak = smoothstep(0.18, 0.92, colStream * 0.65 + (fallFlow * 0.5 + 0.5) * 0.45);
          float topCrest = smoothstep(2.2, 3.8, worldPos.y);
          float mistSpray = smoothstep(-7.5, -12.0, worldPos.y);
          vec3 deepAqua = vec3(0.10, 0.54, 0.70);
          vec3 brightFoam = vec3(0.86, 0.96, 1.00);
          col = mix(deepAqua, brightFoam, clamp(streak * 0.78 + topCrest * 0.45 + mistSpray * 0.55, 0.0, 0.96));
          N = normalize(inN + vec3(sin(worldPos.x * 5.0) * 0.08, (fallFlow) * 0.12, 0.0));
          specBoost = 0.65;
          waterGlow = clamp(streak * 0.22 + mistSpray * 0.18, 0.0, 0.35);
        }
      } else if (nearDetail) {
        if (style < 0.5) {
          float strata = hash31(floor(vec3(worldPos.x * 2.5, worldPos.y * 0.85, worldPos.z * 2.5)));
          float crack = smoothstep(0.0, 0.14, abs(fract(worldPos.y * 1.4 + strata * 0.5) - 0.5));
          col += (strata - 0.5) * 0.12;
          microAO = mix(0.72, 1.05, crack);
          N = normalize(inN + vec3(strata - 0.5, 0.15 * (crack - 0.5), strata - 0.5) * 0.26);
        } else if (style < 1.5) {
          float row = floor(cuv.y * 3.0);
          float bu = fract(cuv.x * 2.0 + mod(row, 2.0) * 0.5);
          float bv = fract(cuv.y * 3.0);
          float mortar = min(min(bu, 1.0 - bu), min(bv, 1.0 - bv));
          float brickTone = hash31(floor(worldPos * 4.4) + vec3(row, 0.0, 0.0));
          col += (brickTone - 0.5) * 0.09;
          microAO = mix(0.73, 1.06, smoothstep(0.0, 0.12, mortar));
          N = normalize(inN + vec3(bu - 0.5, bv - 0.5, 0.0) * 0.14);
        } else if (style < 2.5) {
          float ribU = fract(cuv.x * 3.0);
          float ribV = fract(cuv.y * 3.0);
          float ridgeShadow = smoothstep(0.0, 0.18, ribV) * smoothstep(0.0, 0.15, min(ribU, 1.0 - ribU));
          col *= mix(0.75, 1.10, ridgeShadow);
          N = normalize(inN + vec3((ribU - 0.5) * 0.28, (ribV - 0.5) * 0.22, 0.0));
          specBoost = 0.28;
        } else if (style < 3.5) {
          float leaf = hash31(floor(worldPos * 5.5));
          col += (leaf - 0.5) * 0.14;
          microAO = mix(0.82, 1.08, leaf);
        } else if (style < 4.5) {
          float plank = fract(cuv.x * 4.0);
          float grain = hash31(floor(vec3(worldPos.x * 6.0, worldPos.y * 2.0, worldPos.z * 6.0)));
          col += (grain - 0.5) * 0.07;
          microAO = mix(0.76, 1.04, smoothstep(0.0, 0.12, min(plank, 1.0 - plank)));
        } else if (style > 6.5) {
          float su = fract(cuv.x * 2.0 + floor(cuv.y * 2.0) * 0.5);
          float sv = fract(cuv.y * 2.0);
          float scaleEdge = min(min(su, 1.0 - su), min(sv, 1.0 - sv));
          microAO = mix(0.78, 1.08, smoothstep(0.0, 0.18, scaleEdge));
          specBoost = 0.30;
        }
      }

      if (uRainWetness > 0.01 && isWater < 0.5 && style < 6.5) {
        float rainStreak = nearDetail ? sin(worldPos.y * 2.6 + uTime * 16.0 + hash31(vec3(floor(worldPos.xz * 2.2), 1.0)) * 6.28) : 0.0;
        float wallSheen = nearDetail ? (1.0 - abs(inN.y)) * smoothstep(0.20, 0.95, rainStreak) * 0.24 * uRainWetness : 0.0;

    btnFire.addEventListener('pointerdown', () => { fireKeyHeld = true; breathAnim.green.held = true; triggerFireBurst(3.45); });

    const BRAZIERS = [
      [-18 * VS, 22 * VS, 22 * VS], [18 * VS, 22 * VS, 22 * VS],
      [-26 * VS, 22 * VS, 42 * VS], [26 * VS, 22 * VS, 42 * VS],
      [-18 * VS, 81 * VS, 8 * VS], [18 * VS, 81 * VS, 8 * VS],

    ];

    const CONVERGE_POINT = [0.0, 23.5, 25.5];

    const DRAGON_CONFIGS = {
      green: {
        segs: 72, segLen: 0.78, speed: 0.34, dir: -1, theta: 2.15, safeR: 16.5,
        convEntryTheta: 2.35, swimFreq: 4.2, swimAmp: 1.05, convPath: null,
        swimPhase: 0, vertPhase: 0, limbPhase: 0, bBoostSmooth: 0,
        orbitFn: th => {
          const rx = 16.5 + 1.4 * Math.sin(th * 2.0 + 0.5);
          const rz = 16.0 + 1.4 * Math.cos(th * 2.0 + 0.5);
          return [Math.cos(th) * rx, 34.0 - 2.2 * Math.sin(th) + 1.3 * Math.cos(th * 2.0 + 0.4), Math.sin(th) * rz - 2.0];
        },
        convRawFn: u => {
          const head = [-12.5, 27.0, 23.5];
          return [
            head[0] - 13.5 * Math.sin(u * 1.85) + 3.2 * Math.sin(u * 4.2),
            head[1] + 6.5 * Math.sin(u * 2.2) - 1.8 * u,
            head[2] - 18.0 * u - 3.2 * Math.sin(u * 3.1)
          ];
        }
      },
      white: {
        segs: 76, segLen: 0.74, speed: 0.38, dir: 1, theta: -0.65, safeR: 22.0,
        convEntryTheta: 0.85, swimFreq: 5.1, swimAmp: 1.38, convPath: null,
        swimPhase: 1.1, vertPhase: 0.8, limbPhase: 1.1, bBoostSmooth: 0,
        orbitFn: th => {
          const rx = 24.5 + 1.7 * Math.cos(th * 2.0 - 0.6);
          const rz = 23.5 + 1.7 * Math.sin(th * 2.0 - 0.6);
          return [Math.cos(th) * rx, 39.2 - 2.2 * Math.sin(th) + 1.4 * Math.cos(th * 2.0 - 0.3), Math.sin(th) * rz - 1.8];
        },
        convRawFn: u => {
          const head = [1.8, 35.5, 20.5];
          return [
            head[0] + 12.5 * Math.sin(u * 2.3) + 3.0 * Math.sin(u * 4.8),
            head[1] + 2.8 * Math.sin(u * 3.2) - 2.6 * u * u,
            head[2] - 17.5 * u + 2.8 * Math.cos(u * 3.4)
          ];
        }
      },
      black: {
        segs: 72, segLen: 0.80, speed: 0.28, dir: -1, theta: 0.75, safeR: 30.0,
        convEntryTheta: 0.25, swimFreq: 3.6, swimAmp: 1.12, convPath: null,
        swimPhase: 2.3, vertPhase: 1.7, limbPhase: 2.3, bBoostSmooth: 0,
        orbitFn: th => {
          const rx = 43.5 + 1.8 * Math.sin(th * 2.0 + 1.1);
          const rz = 41.0 + 1.8 * Math.cos(th * 2.0 + 1.1);
          return [Math.cos(th) * rx, 26.5 - 2.2 * Math.sin(th) + 1.5 * Math.sin(th * 2.0 + 1.0), Math.sin(th) * rz - 1.5];
        },
        convRawFn: u => {
          const head = [13.5, 26.8, 23.5];
          return [
            head[0] + 12.0 * Math.sin(u * 2.1) - 2.0 * Math.sin(u * 4.0),
            head[1] + 5.0 * Math.sin(u * 2.6) - 2.5 * u,
            head[2] - 19.5 * u + 3.0 * Math.sin(u * 3.1)
          ];
        }
      }
    };

    // Build uniform arc-length lookup tables + Tail-to-Head coil arrays
    for (const key of Object.keys(DRAGON_CONFIGS)) {
      const cfg = DRAGON_CONFIGS[key];
      const SAMPLES = 120;
      const pts = [], cum = [0];
      for (let s = 0; s <= SAMPLES; s++) {
        const p = cfg.convRawFn(s / SAMPLES);
        pts.push(p);
        if (s > 0) {
          const d = Math.hypot(p[0] - pts[s - 1][0], p[1] - pts[s - 1][1], p[2] - pts[s - 1][2]);
          cum.push(cum[s - 1] + d);
        }
      }
      const total = cum[SAMPLES];
      cfg.convFn = dist => {
        const target = clamp(dist, 0, total);
        let lo = 0, hi = SAMPLES;
        while (lo + 1 < hi) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
        const span = cum[hi] - cum[lo] || 1, t = (target - cum[lo]) / span;
        return mix3(pts[lo], pts[hi], t);
      };
      // Build coil points ordered Tail -> Head so head enters from Tail and follows body flow naturally!
      const nCoil = 68;
      cfg.convCoilPts = [];
      for (let i = nCoil; i >= 0; i--) {
        cfg.convCoilPts.push(cfg.convFn((i / nCoil) * Math.min(total, cfg.segs * cfg.segLen)));
      }
    }

    function stepOrbitBack(cfg, theta, targetLen) {
      let curT = theta, curP = cfg.orbitFn(curT), acc = 0;
      const dt = -cfg.dir * 0.014;
      for (let k = 0; k < 24; k++) {
        const nextT = curT + dt, nextP = cfg.orbitFn(nextT);
        const seg = Math.hypot(nextP[0] - curP[0], nextP[1] - curP[1], nextP[2] - curP[2]);
        if (acc + seg >= targetLen) return curT + dt * ((targetLen - acc) / (seg || 1));
        acc += seg; curT = nextT; curP = nextP;
      }
      return curT;
    }

    function hermite3(p0, v0, p1, v1, t) {
      const t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      return [
        h00 * p0[0] + h10 * v0[0] + h01 * p1[0] + h11 * v1[0],
        h00 * p0[1] + h10 * v0[1] + h01 * p1[1] + h11 * v1[1],
        h00 * p0[2] + h10 * v0[2] + h01 * p1[2] + h11 * v1[2]
      ];
    }

    function buildDragonConvPath(cfg) {
      const pts = [];
      // 1. Pre-Orbit history (84 steps behind current head angle)
      const nPre = 84;
      const preT = new Float32Array(nPre + 1);
      preT[nPre] = cfg.theta;
      for (let i = nPre - 1; i >= 0; i--) preT[i] = stepOrbitBack(cfg, preT[i + 1], cfg.segLen * 0.95);
      for (let i = 0; i <= nPre; i++) pts.push(cfg.orbitFn(preT[i]));

      const p0 = pts[pts.length - 1];
      const t0 = norm3(sub(cfg.orbitFn(cfg.theta + cfg.dir * 0.05), p0));
      const v0 = Math.hypot(...sub(cfg.orbitFn(cfg.theta + cfg.dir * 0.05), p0)) / 0.05 * cfg.speed;

      // 2. Smooth radial-guarded Sky Bridge from current head -> Tail of S-coil!
      const pTail = cfg.convCoilPts[0];
      const tTail = norm3(sub(cfg.convCoilPts[1], pTail));
      const chord = Math.hypot(pTail[0] - p0[0], pTail[1] - p0[1], pTail[2] - p0[2]);
      const hScale = clamp(chord * 0.55, 16.0, 38.0);
      const vStart = [t0[0] * hScale, t0[1] * hScale, t0[2] * hScale];
      const vEnd = [tTail[0] * hScale, tTail[1] * hScale, tTail[2] * hScale];
      const r0 = Math.hypot(p0[0], p0[2]), rTail = Math.hypot(pTail[0], pTail[2]);
      const nBridge = 46;
      for (let i = 1; i < nBridge; i++) {
        const u = i / nBridge;
        const hp = hermite3(p0, vStart, pTail, vEnd, u);
        // Push outward around central castle corridor & add soaring aerial lift
        const rCur = Math.hypot(hp[0], hp[2]) || 0.01;
        const rFloor = mix(r0, rTail, u) * 0.88 + Math.sin(u * Math.PI) * 5.5;
        const targetR = Math.max(cfg.safeR, rFloor);
        if (rCur < targetR) {
          const boost = mix(rCur, targetR, Math.sin(u * Math.PI));
          hp[0] = (hp[0] / rCur) * boost;
          hp[2] = (hp[2] / rCur) * boost;
        }
        hp[1] += Math.sin(u * Math.PI) * 3.2;
        pts.push(hp);
      }

      // 3. Sculpted S-Coil body -> firing Head position
      const idxFire = pts.length + cfg.convCoilPts.length - 1;
      for (const cp of cfg.convCoilPts) pts.push(cp);

      const pHead = pts[idxFire];
      const tHead = norm3(sub(pts[idxFire], pts[idxFire - 1]));

      // 4. Outbound Release Curve banking forward back onto orbitFn(thExit)
      const thExit = cfg.convEntryTheta + cfg.dir * 1.35;
      const pExit = cfg.orbitFn(thExit);
      const tExit = norm3(sub(cfg.orbitFn(thExit + cfg.dir * 0.05), pExit));
      const vExit = Math.hypot(...sub(cfg.orbitFn(thExit + cfg.dir * 0.05), pExit)) / 0.05 * cfg.speed;
      const outChord = Math.hypot(pExit[0] - pHead[0], pExit[1] - pHead[1], pExit[2] - pHead[2]);
      const hOut = clamp(outChord * 0.52, 14.0, 32.0);
      const nOut = 44;
      for (let i = 1; i < nOut; i++) {
        const u = i / nOut;
        const hp = hermite3(pHead, [tHead[0] * hOut, tHead[1] * hOut, tHead[2] * hOut], pExit, [tExit[0] * hOut, tExit[1] * hOut, tExit[2] * hOut], u);
        const rCur = Math.hypot(hp[0], hp[2]) || 0.01;
        const rMinOut = cfg.safeR + Math.sin(u * Math.PI) * 4.0;
        if (rCur < rMinOut) {
          const boost = mix(rCur, rMinOut, Math.sin(u * Math.PI));
          hp[0] = (hp[0] / rCur) * boost; hp[2] = (hp[2] / rCur) * boost;
        }
        hp[1] += Math.sin(u * Math.PI) * 2.5;
        pts.push(hp);
      }

      // 5. Post-Orbit Cruise ahead of release (long enough that full tail re-enters circular orbit seamlessly)
      let curTh = thExit;
      let accPost = 0;
      const neededPostLen = cfg.segs * cfg.segLen + 6.0;
      const stepTh = cfg.dir * 0.024;
      let prevP = cfg.orbitFn(curTh);
      pts.push(prevP);
      while (accPost < neededPostLen) {
        curTh += stepTh;
        const np = cfg.orbitFn(curTh);
        accPost += Math.hypot(np[0] - prevP[0], np[1] - prevP[1], np[2] - prevP[2]);
        pts.push(np);
        prevP = np;
      }

      const cum = new Float32Array(pts.length);
      cum[0] = 0;
      for (let i = 1; i < pts.length; i++) {
        cum[i] = cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]);
      }
      cfg.convPath = {
        pts, cum,
        s0: cum[nPre], sFire: cum[idxFire], sEnd: cum[pts.length - 1],
        v0, vExit, thAtEnd: curTh
      };
    }

    function sampleConvPath(cp, s) {
      const cum = cp.cum, pts = cp.pts, last = pts.length - 1;
      const target = clamp(s, 0, cum[last]);
      let lo = 0, hi = last;
      while (lo + 1 < hi) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
      const span = cum[hi] - cum[lo] || 1, t = (target - cum[lo]) / span;
      return mix3(pts[lo], pts[hi], t);
    }

    const tmHash = location.hash.match(/(?:^|#)t=([0-9.]+)/);
    if (tmHash) {
      const hashTime = parseFloat(tmHash[1]) || 0;
      for (const k of Object.keys(DRAGON_CONFIGS)) DRAGON_CONFIGS[k].theta += DRAGON_CONFIGS[k].dir * hashTime * DRAGON_CONFIGS[k].speed;
    }
    if (location.hash.includes('converge')) {
      for (const k of Object.keys(DRAGON_CONFIGS)) buildDragonConvPath(DRAGON_CONFIGS[k]);
      const ht = location.hash.match(/converge_t=([0-9.]+)/);
      convTime = ht ? parseFloat(ht[1]) : 3.2;
      needConvBurst = convTime >= 2.35 && convTime < 5.75;
    }

    function buildDragonSkeleton(cfg, sHeadOpt, aimW, swimBoost, breathPose = null) {
      const N = cfg.segs;
      const pos = new Array(N);
      let rawOrbHeadFwd = null;
      const sp = cfg.swimPhase, vp = cfg.vertPhase;

      if (sHeadOpt !== null && cfg.convPath) {
        const cp = cfg.convPath;
        for (let i = 0; i < N; i++) {
          const s = sHeadOpt - i * cfg.segLen;
          const base = sampleConvPath(cp, s);
          const pAhead = sampleConvPath(cp, Math.min(cp.sEnd, s + 0.6));
          const pBack = sampleConvPath(cp, Math.max(0, s - 0.6));
          const tang = norm3(sub(pAhead, pBack));
          const lat = norm3(cross([0, 1, 0], tang));
          const amp = clamp(i / 6.0, 0.05, 1.0) * cfg.swimAmp * (0.68 + swimBoost * 0.55);
          const sw = Math.sin(sp - i * 0.24) * amp;
          const sv = Math.cos(vp - i * 0.21) * amp * 0.34;
          pos[i] = [base[0] + lat[0] * sw, base[1] + sv, base[2] + lat[2] * sw];
        }
        rawOrbHeadFwd = norm3(sub(pos[0], pos[2]));
      } else {
        const thetaHead = cfg.theta;
        const rawT = new Float32Array(N);
        rawT[0] = thetaHead;
        for (let i = 1; i < N; i++) rawT[i] = stepOrbitBack(cfg, rawT[i - 1], cfg.segLen);
        for (let i = 0; i < N; i++) {
          const th = rawT[i];
          const orbP = cfg.orbitFn(th);
          const pAhead = cfg.orbitFn(th + cfg.dir * 0.04);
          const tang = norm3(sub(pAhead, orbP));
          const lat = norm3(cross([0, 1, 0], tang));
          const neckBias = i < 16 ? Math.sin((1.0 - i / 16) * Math.PI * 0.85) : 0.0;
          const amp = clamp(i / 6.0, 0.06, 1.0) * cfg.swimAmp * (1.0 + cfg.bBoostSmooth * 0.45);
          const sw = Math.sin(sp - i * 0.24) * amp;
          const sv = Math.cos(vp - i * 0.21) * amp * 0.36 + neckBias * (breathPose ? breathPose.charge * 1.1 : 0);
          const lungeF = breathPose ? (breathPose.recoil * neckBias) : 0;
          pos[i] = [orbP[0] + lat[0] * sw + tang[0] * lungeF, orbP[1] + sv, orbP[2] + lat[2] * sw + tang[2] * lungeF];
        }
        const aheadHead = cfg.orbitFn(thetaHead + cfg.dir * 0.08);
        rawOrbHeadFwd = norm3(sub(aheadHead, pos[0]));
      }

      const fwd = new Array(N), right = new Array(N), up = new Array(N);
      const baseLat = norm3(cross([0, 1, 0], rawOrbHeadFwd));
      const basePitch = clamp(rawOrbHeadFwd[1] * 0.65, -0.35, 0.35);
      const pYaw = breathPose ? breathPose.yawOff : 0;
      const pPitch = breathPose ? breathPose.pitchOff : 0;
      const flightFwd = norm3([
        rawOrbHeadFwd[0] + baseLat[0] * pYaw,
        basePitch + pPitch,
        rawOrbHeadFwd[2] + baseLat[2] * pYaw
      ]);
      const convHeadFwd = norm3(sub(CONVERGE_POINT, pos[0]));
      fwd[0] = norm3(mix3(flightFwd, convHeadFwd, aimW));
      right[0] = norm3(cross([0, 1, 0], fwd[0]));
      up[0] = cross(fwd[0], right[0]);

      for (let i = 1; i < N; i++) {
        fwd[i] = norm3(sub(pos[i - 1], pos[i]));
        const blendedUp = norm3([up[i - 1][0] * 0.88, up[i - 1][1] * 0.88 + 0.12, up[i - 1][2] * 0.88]);
        right[i] = norm3(cross(blendedUp, fwd[i]));
        up[i] = cross(fwd[i], right[i]);
      }
      return { pos, fwd, right, up };
    }

    // ---------- Lighting & Weather Presets ----------
    const PRESETS = {

    let currentTimeMode = location.hash.includes('night') ? 'night' : (location.hash.includes('day') ? 'day' : 'sunset');
    let currentWeather = location.hash.includes('storm') ? 'storm' : ((!location.hash.includes('snowbreath') && location.hash.includes('snow')) ? 'snow' : (location.hash.includes('fog') ? 'fog' : 'clear'));

    // ---------- Camera & Controls ----------
    const isPortraitView = window.innerHeight > window.innerWidth * 1.05;

      arr[o + 0] = px; arr[o + 1] = py; arr[o + 2] = pz;
      arr[o + 3] = q[0]; arr[o + 4] = q[1]; arr[o + 5] = q[2]; arr[o + 6] = q[3];
      arr[o + 7] = sx; arr[o + 8] = sy; arr[o + 9] = sz;
      arr[o + 10] = col[0]; arr[o + 11] = col[1]; arr[o + 12] = col[2];
      arr[o + 13] = emissive; arr[o + 14] = style;
      return count + 1;
    }
    function pushBox(px, py, pz, q, sx, sy, sz, col, emissive = 0, style = 5.0) {
      instCount = writeInst(instArray, instCount, MAX_INSTANCES, px, py, pz, q, sx, sy, sz, col, emissive, style);
    }
    function pushWxBox(px, py, pz, q, sx, sy, sz, col, alpha = 0.5, style = 0.0) {
      wxCount = writeInst(wxArray, wxCount, MAX_WX_INSTANCES, px, py, pz, q, sx, sy, sz, col, alpha, style);
    }
    const ID_Q = [0, 0, 0, 1];

    function pushCable(p0, p1, col) {

      }
    }

    // ---------- Reusable High-Detail Dragon Renderer (Sculpted Armor & Overdrive Luminescence) ----------
    function drawDragon(skel, styleCfg, jawOpen, time, boostGlow = 0) {

      const emScale = boostGlow * (vType === 'white' ? 0.03 : 0.14);
      const emDetail = boostGlow * (vType === 'white' ? 0.65 : 1.05);

      function hBox(f, r, u, sx, sy, sz, col, em = 0, st = 7.0) {

    const XUANWU_CFG = {
      theta: -0.26, speed: 0.042, swimPhase: 0.0, snakePhase: 0.0, summonBoost: 0.0, chargePose: 0.0,
      orbitFn: th => {

    function drawXuanwu(xwCfg, time, nightGlowMult, boostIntensity = 0, waterStrength = 0, summonRamp = 0) {

      const crouchDip = chargeP > 0.01 ? (Math.sin(chargeP * Math.PI) * 1.35 - Math.max(0, 0.35 - chargeP) * 0.85) : 0.0;

      const up = [pUp[0] * cr - rawR[0] * sr, pUp[1] * cr - rawR[1] * sr, pUp[2] * cr - rawR[2] * sr];
      const fwd = pFwd;

      thBox(0.32, 0, 0.92, 1.48, 0.26, 1.58, tGold, emGold * 1.25, 5.0);
      thBox(0.28, 0, 0.98, 0.92, 0.22, 0.96, tShellDark, 0, 7.0);

      const tjQ = quatFromFrame(hRight, cross(tjFwd, hRight), tjFwd);
      thBox(0.48, 0, -0.64 - tortoiseJawOpen * 0.46, 1.60, 0.44, 1.88, tShellMid, 0, 7.0, tjQ);

        thBox(0.58, 1.06 * s, 0.26, 0.28, 0.42, 0.66, tEye, (2.6 + chargeP * 1.4) * nightM, 5.0);
        thBox(-0.35, 1.04 * s, 0.06, 0.24, 0.32, 0.84, tRune, emRune * 0.96, 5.0);

        // Swept-back Golden Dragon-Tortoise Horns & Lateral Cheek Spikes + Flowing Chin Barbels
        thBox(-0.55, 0.82 * s, 0.96, 0.34, 0.36, 0.95, tGold, emGold * 1.2, 5.0);
        thBox(-1.12, 0.96 * s, 1.24, 0.26, 0.28, 0.82, tRune, emRune * 1.05, 5.0);
        thBox(-0.48, 1.18 * s, -0.24, 0.42, 0.26, 0.58, tGold, emGold, 5.0);
        thBox(0.95, 0.78 * s, -0.68 - tortoiseJawOpen * 0.32, 0.18, 0.56, 0.22, tRune, emRune * 0.95, 5.0, tjQ);
      }

      // 4 Heavy Armored Swimming Flippers with Shoulder Pauldrons, Runic Scale Clusters & 5 Hooked Ivory Claws
      const legConfigs = [
        [ 3.05, -2.85,  1, -1, 0.0],
        [ 3.05,  2.85,  1,  1, Math.PI],
        [-2.95, -2.75, -1, -1, Math.PI + 0.25],
        [-2.95,  2.75, -1,  1, 0.25]
      ];
      for (const [lf, lr, fS, rS, phase] of legConfigs) {
        const stroke = Math.sin(swP + phase) * (1.0 - chargeP * 0.65) + chargeP * fS * 0.35;
        const lift = Math.cos(swP + phase) * (1.0 - chargeP * 0.65) + (fS > 0 ? chargeP * 0.48 : -chargeP * 0.18);
        const shP = [shellC[0] + fwd[0] * lf + right[0] * lr - up[0] * 1.12, shellC[1] + fwd[1] * lf + right[1] * lr - up[1] * 1.12, shellC[2] + fwd[2] * lf + right[2] * lr - up[2] * 1.12];

        xBox(lf + fS * 0.24, lr * 1.16, -0.72, 1.62, 0.32, 1.48, tGold, emGold, 5.0);

        const knP = [
          shP[0] + fwd[0] * (fS * (1.18 + stroke * 0.75)) + right[0] * (rS * (1.48 - stroke * 0.22 + chargeP * 0.28)) - up[0] * (0.45 - lift * 0.32),
          shP[1] + fwd[1] * (fS * (1.18 + stroke * 0.75)) + right[1] * (rS * (1.48 - stroke * 0.22 + chargeP * 0.28)) - up[1] * (0.45 - lift * 0.32),
          shP[2] + fwd[2] * (fS * (1.18 + stroke * 0.75)) + right[2] * (rS * (1.48 - stroke * 0.22 + chargeP * 0.28)) - up[2] * (0.45 - lift * 0.32)
        ];
        const ftP = [
          knP[0] + fwd[0] * (0.84 * fS + stroke * 0.45) + right[0] * (rS * 0.56) - up[0] * (1.14 - Math.max(0, lift) * 0.38),
          knP[1] + fwd[1] * (0.84 * fS + stroke * 0.45) + right[1] * (rS * 0.56) - up[1] * (1.14 - Math.max(0, lift) * 0.38),
          knP[2] + fwd[2] * (0.84 * fS + stroke * 0.45) + right[2] * (rS * 0.56) - up[2] * (1.14 - Math.max(0, lift) * 0.38)

        const uD = sub(knP, shP), uM = mix3(shP, knP, 0.5);

        const shinQ = quatFromBasis(fD, 0);
        pushBox(uM[0], uM[1], uM[2], legQ, 1.44, 1.36, Math.hypot(...uD) * 1.16, tShellDark, 0, 7.0);

      // 6-Segment Spiked Armored Tortoise Tail with Glowing Cyan Tail-Mace
      for (let t = 0; t < 6; t++) {

      // 52-Segment Dorsal-Crested Jade-Gold Coiled Guardian Serpent + Flared Cobra Hood & Fanged Viper Head
      const sJade = [0.14, 0.70, 0.42], sTeal = [0.08, 0.55, 0.58], sGold = [0.95, 0.79, 0.24];

      const N_S = 52;
      const sPts = new Array(N_S);
      const sCtrl = [
        [-3.95, -2.05, -0.75],

        [ 1.65, -3.65,  0.92],

        // Flared Cobra-Dragon Upper Neck Hood Ribs (near head i >= N_S - 7)

          pushBox(mPos[0], mPos[1] + sU[1] * 0.06, mPos[2], sq, hoodW * 1.06, rad * 0.22, segLen * 0.72, sGold, emGold * 1.25, 5.0);

      // Serpent Viper Head: Crown Horns, Flared Temple Shields, Amber Eyes, 4 Fangs & Forked Tongue
      const shEnd = sPts[N_S - 1], shPrev = sPts[N_S - 2];
      const skBaseFwd = norm3(sub(shEnd, shPrev));
      const skTargetF = norm3([
        fwd[0] * 0.82 + right[0] * Math.sin(snP * 0.95) * 0.38 + up[0] * (-0.12 + chargeP * 0.44),
        fwd[1] * 0.82 + right[1] * Math.sin(snP * 0.95) * 0.38 + up[1] * (-0.12 + chargeP * 0.44),

      ]);

      const skRight = norm3(cross(up, skFwd)), skUp = cross(skFwd, skRight);

      const hissOpen = clamp(0.28 + Math.pow(Math.max(0, Math.sin(snP * 0.85)), 3.0) * 0.65 + chargeP * 0.75, 0.25, 1.05);
      function sHBox(lf, lr, lu, sx, sy, sz, col, em = 0, st = 7.0, q = skQ) {

      for (let w = 0; w < 10; w++) {

      if (waterStrength > 0.05 || summonRamp > 0.05) {

        for (let sp = 0; sp < 16; sp++) {
          const ph = ((time * (1.45 + summonRamp * 1.1) + sp / 16) % 1.0);
          const ang = (sp / 16) * Math.PI * 2 + swP * 0.4;
          const distR = 4.6 + ph * (4.0 + summonRamp * 5.6);
          const arcY = -0.35 + Math.sin(ph * Math.PI) * (1.9 + summonRamp * 3.6);
          const sz = (0.34 + 0.22 * (1 - ph)) * (0.7 + sprayAmt * 0.6);
          pushBox(shellC[0] + Math.cos(ang) * distR, baseP[1] + arcY, shellC[2] + Math.sin(ang) * distR, ID_Q, sz, sz, sz, ph < 0.4 ? [0.85, 0.98, 1.0] : [0.32, 0.88, 0.98], (0.60 + summonRamp * 1.25) * (1 - ph) * nightM, 5.0);
        }
      }

    }

    const SNOW_QUATS = Array.from({ length: 24 }, () => [0, 0, 0, 1]);
    const lightPosBuf = new Float32Array(42);
    const lightColBuf = new Float32Array(42);
    const lightRangeBuf = new Float32Array(14);

    let lastRealTime = null, perfFrameIdx = 0;

        fpsAccumMs += realWallMs;
        if (fpsAccumMs >= 500) {

      }

      let activeGpuQ = null;
      if (timerExt) {

          const ns = gl.getQueryParameter(qp, gl.QUERY_RESULT);
          gl.deleteQuery(qp);

            gpuMsSmooth = gpuMsSmooth * 0.78 + (ns * 1e-6) * 0.22;
            if (now - lastScaleAdjust > 850) {
              if (gpuMsSmooth > 15.8 && dynResScale > 0.58) {
                dynResScale = Math.max(0.58, +(dynResScale - 0.08).toFixed(2));
                lastScaleAdjust = now;
                resize();
              } else if (gpuMsSmooth < 12.8 && dynResScale < 1.0 && now - lastScaleAdjust > 1800) {
                dynResScale = Math.min(1.0, +(dynResScale + 0.04).toFixed(2));

        }
      } else if (now - lastScaleAdjust > 1000 && perfFrameIdx > 18) {

          dynResScale = Math.max(0.58, +(dynResScale - 0.08).toFixed(2));
          lastScaleAdjust = now;
          resize();
        }
      }
      perfFrameIdx++;

      const dt = lastRealTime === null ? 0.016 : clamp((now - lastRealTime) * 0.001, 0.0, 0.05);
      lastRealTime = now;
      if (playing) simTime += dt;

      const basePreset = PRESETS[currentTimeMode];

      if (boostTime >= 0 && playing) {
        boostTime += dt;
        if (boostTime >= boostDuration) {
          boostTime = -1;
          dragonBoostTrails.green.length = dragonBoostTrails.white.length = dragonBoostTrails.black.length = 0;
        }
      }

        ? smootherstep(0.0, 1.15, boostTime) * (1.0 - smootherstep(boostDuration - 1.65, boostDuration, boostTime))
        : 0.0;
      const orbitSpeedMult = 1.0 + boostRamp * 5.20;
      const crimsonSky = boostRamp;

      // Follow-The-Leader Convergence Flight Choreography (0..2.35 swoop, 2.35..5.75 hover+fire, 5.75..7.80 release)
      const cGatherT = 2.35, cHoldT = 5.75, cTotalT = 7.80;
      let aimW = 0, swimBoost = 0, convBreathing = false, shakeMag = 0;
      let sGreen = null, sWhite = null, sBlack = null;
      if (convTime >= 0) {

          }
        } else {
          const getHeadS = cp => {
            if (!cp) return null;
            if (convTime < cGatherT) {

            }

          sGreen = getHeadS(DRAGON_CONFIGS.green.convPath);
          sWhite = getHeadS(DRAGON_CONFIGS.white.convPath);
          sBlack = getHeadS(DRAGON_CONFIGS.black.convPath);

          convBreathing = convTime >= cGatherT && convTime < cHoldT;

        for (const k of Object.keys(DRAGON_CONFIGS)) {

        convTime >= 0
          ? 'border-purple-400 bg-purple-600 text-white shadow-sm'
          : 'border-purple-500/70 bg-purple-500/20 hover:bg-purple-500/35 text-purple-400'

      btnBoost.className = `pill-btn px-1.5 py-0.5 rounded border font-semibold ${
        boostTime >= 0
          ? 'border-red-400 bg-red-600 text-white shadow-sm'
          : 'border-red-500/75 bg-red-600/20 hover:bg-red-600/35 text-red-400'
      }`;

      rainWetSmooth += ((currentWeather === 'storm' ? 1.0 : 0.0) - rainWetSmooth) * Math.min(1, dt * 3.5);
      snowCoverSmooth += ((currentWeather === 'snow' ? 1.0 : 0.0) - snowCoverSmooth) * Math.min(1, dt * 1.8);
      const targetFogDens = currentWeather === 'fog' ? 2.35 : (currentWeather === 'clear' ? 1.0 : 1.55);

        pushBox(cx, cy, cz, quatFromBasis(bf, 0), 0.22, 0.18, 0.72, [0.97, 0.97, 0.96], 0, 5.0);
        pushBox(cx + bRight[0] * 0.42, cy + flap, cz + bRight[2] * 0.42, quatFromBasis(bf, flap * 1.2), 0.72, 0.08, 0.26, [0.98, 0.98, 0.97], 0, 5.0);
        pushBox(cx - bRight[0] * 0.42, cy + flap, cz - bRight[2] * 0.42, quatFromBasis(bf, -flap * 1.2), 0.72, 0.08, 0.26, [0.98, 0.98, 0.97], 0, 5.0);
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, instArray.subarray(0, instCount * INST_FLOATS));
      if (wxCount > 0) {
        gl.bindBuffer(gl.ARRAY_BUFFER, wxBuf);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, wxArray.subarray(0, wxCount * INST_FLOATS));
      }

      // Point Lights Setup (13 Dynamic Lights incl. Dragons, Castle, Convergence & Fire Phoenix!)
      const f0 = 0.92 + 0.12 * Math.sin(simTime * 11.0), f1 = 0.92 + 0.12 * Math.cos(simTime * 13.0);
      const blackMid = skelBlack.pos[20], whiteMid = skelWhite.pos[12];
      const convBoost = convBreathing ? 1.8 : 0.0;
      const fireInt = fireParticles.length > 0 ? clamp(fireParticles.length / 40, 0.2, 1.4) : 0.0;
      const frostBoost = isFiringWhite ? 2.1 : 1.0;
      const phBoost = ((phoenixTime >= 0 ? 1.4 : 1.0) + boostRamp * 1.65) * nightGlowMult;

      let lightCount = 0;
      function pushDynLight(px, py, pz, r, g, b, maxR2) {
        if (lightCount >= 14 || r + g + b < 0.015) return;
        const o = lightCount * 3;
        lightPosBuf[o] = px; lightPosBuf[o + 1] = py; lightPosBuf[o + 2] = pz;
        lightColBuf[o] = r; lightColBuf[o + 1] = g; lightColBuf[o + 2] = b;
        lightRangeBuf[lightCount] = maxR2;
        lightCount++;
      }
      const drLightB = 1.0 + boostRamp * 1.45;
      const whiteLightB = 1.0 + boostRamp * 0.45;
      pushDynLight(pearlPos[0], pearlPos[1], pearlPos[2], (2.10 + convBoost) * drLightB, (1.65 + convBoost) * drLightB, (0.68 + convBoost) * drLightB, 850.0);
      pushDynLight(blackMid[0], blackMid[1], blackMid[2], 1.15 * f0 * drLightB, 0.22 * f0 * drLightB, 1.95 * f0 * drLightB, 850.0);
      pushDynLight(whiteMid[0], whiteMid[1], whiteMid[2], 0.55 * f1 * frostBoost * whiteLightB, 1.45 * f1 * frostBoost * whiteLightB, 1.85 * f1 * frostBoost * whiteLightB, 850.0);
      pushDynLight(phPos[0], phPos[1] + 2.0, phPos[2], (2.4 + boostRamp * 2.8) * phBoost * f0, (1.15 - boostRamp * 0.45) * phBoost * f0, (0.28 - boostRamp * 0.12) * phBoost * f0, 880.0);
      pushDynLight(-52 * VS, 65 * VS, 52 * VS, 1.4 * torchMult * f0, 0.72 * torchMult * f0, 0.22 * torchMult * f0, 320.0);
      pushDynLight( 52 * VS, 69 * VS, 52 * VS, 1.4 * torchMult * f1, 0.72 * torchMult * f1, 0.22 * torchMult * f1, 320.0);
      pushDynLight( 83 * VS, 40 * VS, 10 * VS, 1.5 * torchMult * f1, 0.76 * torchMult * f1, 0.24 * torchMult * f1, 320.0);
      pushDynLight( 90 * VS, 80 * VS, -82 * VS, 1.5 * torchMult * f0, 0.76 * torchMult * f0, 0.24 * torchMult * f0, 320.0);
      pushDynLight(0, 118 * VS, -10 * VS, 1.7 * torchMult * f0, 0.88 * torchMult * f0, 0.28 * torchMult * f0, 340.0);
      pushDynLight(0, 42 * VS, 56 * VS, 1.3 * torchMult * f1, 0.68 * torchMult * f1, 0.20 * torchMult * f1, 320.0);
      if (convBoost > 0.01) pushDynLight(CONVERGE_POINT[0], CONVERGE_POINT[1], CONVERGE_POINT[2], 2.8 * convBoost, 2.2 * convBoost, 2.8 * convBoost, 920.0);
      if (fireInt > 0.01) pushDynLight(gMouth[0] + gFwd[0] * 6, gMouth[1] + gFwd[1] * 6, gMouth[2] + gFwd[2] * 6, 3.0 * fireInt * f0, 1.35 * fireInt * f0, 0.28 * fireInt * f0, 780.0);
      if (isFiringBlack) pushDynLight(bHead[0] + bFwd[0] * 6, bHead[1] + bFwd[1] * 6, bHead[2] + bFwd[2] * 6, 2.6 * f1, 1.4 * f1, 3.4 * f1, 780.0);
      pushDynLight(xwMarks.shellC[0], xwMarks.shellC[1] + 2.4, xwMarks.shellC[2], 0.32 * nightGlowMult, 1.45 * nightGlowMult, 1.65 * nightGlowMult, 760.0);

      gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
      if (cachedShadowMode !== currentTimeMode) {
        cachedShadowMode = currentTimeMode;
        gl.bindFramebuffer(gl.FRAMEBUFFER, staticShadowFBO);
        gl.viewport(0, 0, SHADOW_RES, SHADOW_RES);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.useProgram(shadowStaticProg);
        gl.uniformMatrix4fv(uShSt.uLightVP, false, lightVP);
        gl.bindVertexArray(staticVAO);
        gl.drawArrays(gl.TRIANGLES, 0, staticVertexCount);
      }

      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, staticShadowFBO);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, shadowFBO);
      gl.blitFramebuffer(0, 0, SHADOW_RES, SHADOW_RES, 0, 0, SHADOW_RES, SHADOW_RES, gl.DEPTH_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
      gl.viewport(0, 0, SHADOW_RES, SHADOW_RES);
      gl.useProgram(shadowInstProg);
      gl.uniformMatrix4fv(uShIn.uLightVP, false, lightVP);
      gl.bindVertexArray(instVAO);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, instCount);

      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
      gl.viewport(0, 0, fboW, fboH);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, shadowTex);

      const useSh = currentWeather === 'storm' ? 0.45 : 1.0;
      function bindSceneUniforms(u) {
        gl.uniformMatrix4fv(u.uProj, false, proj);
        gl.uniformMatrix4fv(u.uView, false, view);
        gl.uniformMatrix4fv(u.uLightVP, false, lightVP);
        gl.uniform3fv(u.uSunDir, basePreset.sunDir);
        gl.uniform3fv(u.uSunColor, sunColor);
        gl.uniform3fv(u.uAmbientColor, ambient);
        gl.uniform3fv(u.uFogColor, fog);
        gl.uniform3fv(u.uFogHorizon, fogHorizon);
        gl.uniform3fv(u.uCamPos, eye);
        gl.uniform1f(u.uTime, simTime);
        gl.uniform1f(u.uRainWetness, rainWetSmooth);
        gl.uniform1f(u.uSnowCover, snowCoverSmooth);
        gl.uniform1f(u.uFogDensity, fogDensSmooth);
        gl.uniform1f(u.uLightning, activeLightning);
        gl.uniform3fv(u['uLightPos[0]'], lightPosBuf);
        gl.uniform3fv(u['uLightCol[0]'], lightColBuf);
        gl.uniform1fv(u['uLightRange[0]'], lightRangeBuf);
        gl.uniform1i(u.uLightCount, lightCount);
        gl.uniform1i(u.uShadowMap, 0);
        gl.uniform1f(u.uUseShadow, useSh);
        if (u.uSeaWater) gl.uniform1f(u.uSeaWater, waterCoverSmooth);
        if (u.uWaterWaveR) gl.uniform1f(u.uWaterWaveR, waterWaveRadius);
        if (u.uSeaSummonFlash) gl.uniform1f(u.uSeaSummonFlash, XUANWU_CFG.summonBoost || 0);
        if (u.uXuanwuPos) gl.uniform2f(u.uXuanwuPos, xwMarks.baseP[0], xwMarks.baseP[2]);
      }

      gl.useProgram(instProg);
      bindSceneUniforms(uIn);
      gl.bindVertexArray(instVAO);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, instCount);

      gl.useProgram(staticProg);
      bindSceneUniforms(uSt);
      gl.bindVertexArray(staticVAO);
      gl.drawArrays(gl.TRIANGLES, 0, staticVertexCount);

      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      gl.useProgram(skyProg);
      gl.uniform3fv(uSky.uSkyTop, skyTop);
      gl.uniform3fv(uSky.uSkyMid, skyMid);
      gl.uniform3fv(uSky.uSkyHorizon, skyHorizon);
      gl.uniform3fv(uSky.uSunDir, basePreset.skySunDir);
      gl.uniform3fv(uSky.uSunColor, sunColor);
      gl.uniform1f(uSky.uStarAmount, starAmt);
      gl.uniform1f(uSky.uSunVis, sunVis);
      gl.uniform1f(uSky.uLightning, activeLightning);
      gl.uniform1f(uSky.uCrimsonGlow, crimsonSky);
      gl.uniform1f(uSky.uTime, simTime);
      gl.uniform3fv(uSky.uCamRight, camRight);
      gl.uniform3fv(uSky.uCamUp, camUp);
      gl.uniform3fv(uSky.uCamFwd, camFwd);
      gl.uniform1f(uSky.uTanHalfFov, Math.tan(fov * 0.5));
      gl.uniform1f(uSky.uAspect, aspect);
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);

      if (wxCount > 0) {
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        gl.enable(gl.CULL_FACE);
        gl.useProgram(wxProg);
        gl.uniformMatrix4fv(uWx.uProj, false, proj);
        gl.uniformMatrix4fv(uWx.uView, false, view);
        gl.uniform3fv(uWx.uSunDir, basePreset.sunDir);
        gl.uniform3fv(uWx.uSunColor, sunColor);
        gl.uniform3fv(uWx.uAmbientColor, ambient);
        gl.uniform3fv(uWx.uFogColor, fog);
        gl.uniform3fv(uWx.uFogHorizon, fogHorizon);
        gl.uniform3fv(uWx.uCamPos, eye);
        gl.uniform1f(uWx.uTime, simTime);
        gl.uniform1f(uWx.uFogDensity, fogDensSmooth);
        gl.uniform1f(uWx.uLightning, activeLightning);
        gl.bindVertexArray(wxVAO);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 36, wxCount);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
      }

      gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
      gl.useProgram(blurProg);
      gl.bindVertexArray(quadVAO);

      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO1);
      gl.viewport(0, 0, bloomW, bloomH);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneGlowTex);
      gl.uniform1i(uBlur.uTex, 0);
      gl.uniform2f(uBlur.uDir, 1.05 / bloomW, 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO2);
      gl.bindTexture(gl.TEXTURE_2D, bloomTex1);
      gl.uniform2f(uBlur.uDir, 0.0, 1.05 / bloomH);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, fboW, fboH);
      gl.useProgram(compProg);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneColTex);
      gl.uniform1i(uComp.uScene, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomTex2);
      gl.uniform1i(uComp.uBloom, 1);
      gl.uniform2f(uComp.uTexel, 1.0 / fboW, 1.0 / fboH);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      if (activeGpuQ) {
        gl.endQuery(timerExt.TIME_ELAPSED_EXT);
        pendingGpuQ.push(activeGpuQ);
      }
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
